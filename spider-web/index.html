<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕸️ Spider Web Nexus | Magic of Code</title>
    <link rel="stylesheet" href="../css/kingdom.css">
    <link rel="stylesheet" href="css/spider-web-network.css">
    <link rel="stylesheet" href="css/spider-web-polish.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="kingdomContainer"></div>

    <script src="../data/spider-web-nexus.js"></script>
    <script src="../js/audio.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/effects.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/comicEngine.js"></script>
    <script src="../js/quizEngine.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/spider-web-components.js"></script>

    <script src="../js/spider-web-kingdom.js"></script>
    <script src="../js/network.js"></script>
    <script src="../js/spider-web-switching-visual-patch.js"></script>
    <script src="../js/spider-web-message-segment-patch.js"></script>
    <script src="../js/network-topology-patch.js"></script>
    <script src="../js/spider-web-enhancements.js"></script>
    <!-- Final transmission animation layer: only the active node-to-node hop glows. -->
    <script src="../js/network-packet-animation-fix.js"></script>

    <script>
    window.addEventListener("load", async function () {
        try {
            if (typeof KINGDOM_DATA === "undefined") {
                console.error("🕸 KINGDOM_DATA failed to load.");
                return;
            }
            if (typeof renderKingdom !== "function") {
                console.error("renderKingdom is not available.");
                return;
            }
            renderKingdom(KINGDOM_DATA);
            if (typeof initializeSpiderWebKingdom === "function") {
                await initializeSpiderWebKingdom(KINGDOM_DATA);
            } else {
                console.error("initializeSpiderWebKingdom is not available.");
            }
        } catch (error) {
            console.error("🕸 Spider Web Nexus initialization failed:", error);
        }
    });
    </script>
</body>
</html>
