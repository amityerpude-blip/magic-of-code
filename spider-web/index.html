<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        🕸️ Spider Web Nexus | Magic of Code

    </title>

    <!--==================================================
                    COMMON CSS
    ==================================================-->

    <link rel="stylesheet"
          href="../css/kingdom.css">

    <link rel="stylesheet"
          href="../themes/spider-web-nexus.css">

    <!--==================================================
                    GOOGLE FONT
    ==================================================-->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!--==================================================
                    LOADING SCREEN
    ==================================================-->

    <div class="loadingScreen"
         id="loadingScreen">

        <div class="loader">

            🕸️

        </div>

        <h2>

            Loading Spider Web Nexus...

        </h2>

    </div>

    <!--==================================================
                    MAGIC PARTICLES
    ==================================================-->

    <div id="particleContainer"></div>

    <!--==================================================
                    MAIN CONTAINER
    ==================================================-->

    <div id="kingdomContainer">

        <!-- Generated Dynamically -->

    </div>

    <!--==================================================
                        AUDIO
    ==================================================-->

    <audio id="buttonSound">

        <source src="assets/audio/button.mp3"
                type="audio/mpeg">

    </audio>

    <audio id="hoverSound">

        <source src="assets/audio/hover.mp3"
                type="audio/mpeg">

    </audio>

    <audio id="pageFlip">

        <source src="assets/audio/page-flip.mp3"
                type="audio/mpeg">

    </audio>

    <audio id="successSound">

        <source src="assets/audio/success.mp3"
                type="audio/mpeg">

    </audio>

    <audio id="magicSound">

        <source src="assets/audio/magic.mp3"
                type="audio/mpeg">

    </audio>

    <!--==================================================
                    KINGDOM DATA
    ==================================================-->

    <script src="../data/spider-web-nexus.js"></script>

    <!--==================================================
                    COMMON ENGINES
    ==================================================-->

    <script src="../js/storage.js"></script>

    <script src="../js/effects.js"></script>

    <script src="../js/navigation.js"></script>

    <script src="../js/comicEngine.js"></script>

    <script src="../js/quizEngine.js"></script>

    <script src="../js/components.js"></script>

    <script src="../js/kingdom.js"></script>

    <!--==================================================
                NETWORK SIMULATOR
    ==================================================-->

    <script src="../js/network.js"></script>

    <!--==================================================
                    START KINGDOM
    ==================================================-->

   <script>

window.addEventListener("load", async () => {

    renderKingdom(KINGDOM_DATA);

    initializeNavigation();

    initializeComic(KINGDOM_DATA);

    initializeQuiz(KINGDOM_DATA);

    initializeEffects();

    initializeButtons(KINGDOM_DATA);

    if (typeof initializeNetworkSimulator === "function") {

        await initializeNetworkSimulator(
            KINGDOM_DATA.networkSimulator
        );

    }

    hideLoading();

});

</script>

</body>

</html>
