<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕸️ Spider Web Nexus | Magic of Code</title>
    <link rel="stylesheet" href="../css/kingdom.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="kingdomContainer"></div>
    <script src="../data/spider-web-nexus.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/effects.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/comicEngine.js"></script>
    <script src="../js/quizEngine.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/kingdom.js"></script>
    <script src="../js/network.js"></script>
    <script src="../js/network-topology-patch.js"></script>
    <script src="../js/spider-web-enhancements.js"></script>
    <script>
    window.addEventListener("load", async () => {
        if (typeof KINGDOM_DATA === "undefined") {
            console.error("KINGDOM_DATA failed to load.");
            return;
        }
        renderKingdom(KINGDOM_DATA);
        if (typeof initializeNavigation === "function") initializeNavigation();
        if (typeof initializeComic === "function") initializeComic(KINGDOM_DATA);
        if (typeof initializeQuiz === "function") initializeQuiz(KINGDOM_DATA);
        if (typeof initializeEffects === "function") initializeEffects();
        if (typeof initializeButtons === "function") initializeButtons(KINGDOM_DATA);
        if (typeof initializeNetworkSimulator === "function") {
            await initializeNetworkSimulator(KINGDOM_DATA.networkSimulator || KINGDOM_DATA);
        }
        if (typeof hideLoading === "function") hideLoading();
    });
    </script>
</body>
</html>
