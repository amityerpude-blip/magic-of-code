<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Coding Quest — The Magical World of Coding.">
<title>Coding Quest | The Magical World of Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/coding-quest-home.css">
<link rel="stylesheet" href="css/coding-quest-video-home.css">
</head>
<body class="home-page cinematic-video-home">

<main class="video-home-stage" aria-label="Coding Quest cinematic entrance">
  <video id="openingVideo" class="quest-video quest-video-opening" autoplay muted playsinline preload="auto" aria-hidden="true">
    <source src="assets/videos/opening.mp4" type="video/mp4">
  </video>

  <video id="repeatVideo" class="quest-video quest-video-repeat" muted playsinline preload="auto" loop aria-hidden="true">
    <source src="assets/videos/repeat.mp4" type="video/mp4">
  </video>

  <div class="video-home-vignette" aria-hidden="true"></div>
  <div class="video-home-stars" aria-hidden="true"></div>

  <div class="video-home-ui">
    <a href="dashboard.html" class="home-corner-logo" aria-label="Coding Quest">
      <img src="assets/coding-quest-logo.svg" alt="Coding Quest">
    </a>

    <section class="video-home-actions" aria-label="Adventure controls">
      <a href="dashboard.html" class="video-start-btn" id="startAdventureBtn">
        <span>✨</span> Start Adventure
      </a>
    </section>

    <div class="video-home-hint" id="videoHomeHint">The magical world is preparing your quest...</div>
  </div>

  <button type="button" class="sound-toggle" id="soundToggle" aria-label="Enable magical sound" title="Enable magical sound">🔇</button>
</main>

<script src="js/app.js"></script>
<script src="js/coding-quest-home.js"></script>
</body>
</html>
