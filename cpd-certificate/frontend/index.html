<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CPD Certificate Generator</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header><div><h1>CPD Certificate Generator</h1><p>PM SHRI Kendriya Vidyalaya Dongargarh · Regional Office: Raipur</p></div><span class="badge">2026</span></header><div class="steps"><button class="step active" data-step="0">1. Participant</button><button class="step" data-step="1">2. Designation</button><button class="step" data-step="2">3. Training</button><button class="step" data-step="3">4. Certificate</button></div><form id="cpdForm" novalidate><section class="panel active" data-panel="0"><h2>Participant Information</h2><div class="grid"><label>Email ID<input type="email" name="email" required placeholder="participant@example.com"></label><label>Name in English<input name="name" required></label><label>नाम हिंदी में<input name="hname" required></label></div><div class="actions"><button type="button" class="primary next">Next →</button></div></section><section class="panel" data-panel="1"><h2>Designation</h2><div class="grid"><label>Post (Subject) in English<input name="post" required></label><label>पदनाम (विषय) हिंदी में<input name="hpost" required></label></div><div class="actions"><button type="button" class="secondary prev">← Back</button><button type="button" class="primary next">Next →</button></div></section><section class="panel" data-panel="2"><h2>Training / Workshop</h2><div class="grid"><label>Topic of training in English<textarea name="training" required></textarea></label><label>कार्यशाला का विषय<textarea name="htraining" required></textarea></label><label>From Date<input type="date" name="fromdate" required></label><label>To Date<input type="date" name="todate" required></label><label>Attended as<select name="participant" required><option value="">Select</option><option>Participant</option><option>Resource Person</option></select></label><label>के रूप में भाग लिया<select name="hparticipant" required><option value="">चुनें</option><option>प्रतिभागी</option><option>संसाधक</option></select></label><label>Total Hours of Training<input type="number" name="hour" min="1" step="0.5" required></label></div><div class="actions"><button type="button" class="secondary prev">← Back</button><button type="button" class="primary next">Review →</button></div></section><section class="panel" data-panel="3"><h2>Review & Generate</h2><div id="review" class="review"></div><div id="status" class="status"></div><div class="actions"><button type="button" class="secondary prev">← Edit</button><button type="submit" class="primary" id="generate">Generate & Email Certificate</button></div></section></form><footer>Certificate is generated from the approved PPTX template and emailed as a PDF.</footer></div><script src="config.js"></script><script src="app.js"></script></body></html>
